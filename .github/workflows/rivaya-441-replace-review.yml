name: Replace RIVAYA 4.3.1 waiting review with 4.4.1 build 45001
on:
  push:
    branches: ['feature/rivaya-widget-polish-441']
    paths:
      - '.github/workflows/rivaya-441-replace-review.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rivaya-store-review-replace
  cancel-in-progress: false
jobs:
  replace-review:
    runs-on: macos-15
    timeout-minutes: 35
    environment: app-store
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: rivaya-next/ios
      - name: Cancel only pending 4.3.1 review, set version to 4.4.1 and attach VALID build 45001
        working-directory: rivaya-next/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: bundle exec ruby scripts/replace-review-431-with-441.rb
      - name: Send existing RIVAYA 4.4.1 build to Apple App Review
        working-directory: rivaya-next/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          FASTLANE_SKIP_UPDATE_CHECK: 'true'
          FASTLANE_HIDE_CHANGELOG: 'true'
          FASTLANE_OPT_OUT_USAGE: 'true'
        run: bundle exec fastlane ios submit_existing_441
