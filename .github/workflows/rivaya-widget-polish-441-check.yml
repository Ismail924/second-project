name: RIVAYA 4.4.1 WidgetKit visual polish simulator checks
on:
  push:
    branches: ['feature/rivaya-widget-polish-441']
    paths:
      - 'rivaya-next/ios/Widgets/RivayaWidgets.swift'
      - 'rivaya-next/ios/project.yml'
      - 'rivaya-next/app/src/main/assets/widget-sync.js'
      - '.github/workflows/rivaya-widget-polish-441-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  widget-simulator:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify real widget metrics and legacy data
        run: |
          node --check rivaya-next/app/src/main/assets/widget-sync.js
          node rivaya-next/tests/widget-snapshot-check.cjs
          node rivaya-next/tests/state-check.cjs
          node rivaya-next/tests/next-state-check.cjs
          node rivaya-next/tests/sync-check.cjs
      - name: Install project build tools
        run: |
          bash rivaya-next/ios/scripts/select-xcode.sh
          python3 rivaya-next/ios/scripts/prepare-resources.py
          brew install xcodegen
      - name: Compile polished widget extension and host app for iPhone
        working-directory: rivaya-next/ios
        run: |
          xcodegen generate
          xcodebuild -project Rivaya.xcodeproj -scheme Rivaya \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          test -d build/Build/Products/Debug-iphonesimulator/Rivaya.app/PlugIns/RivayaWidgets.appex
          echo "PASS: polished WidgetKit extension and app compile together."
