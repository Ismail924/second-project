name: RIVAYA 4.5 publish verified new screenshots with App Store update
on:
  push:
    branches: ['feature/rivaya-4.5-optional-shared-goals-steps']
    paths: ['.github/workflows/rivaya-45-submit-after-screens.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rivaya-45-submit-after-screens
  cancel-in-progress: false
jobs:
  review:
    runs-on: macos-15
    environment: app-store
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: rivaya-next/ios
      - name: Require all corrected screenshots for iPhone 6.9 and 6.3 and clear obsolete PPO-only review
        working-directory: rivaya-next/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: bundle exec ruby scripts/release-45-screenshot-gate.rb
      - name: Submit exact 4.5.0 build 46004 with verified replacement images for Apple review and automatic release
        working-directory: rivaya-next/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          FASTLANE_SKIP_UPDATE_CHECK: 'true'
          FASTLANE_HIDE_CHANGELOG: 'true'
          FASTLANE_OPT_OUT_USAGE: 'true'
        run: bundle exec fastlane ios submit_existing_45

# Retry now that Apple has confirmed both complete replacement screenshot sets.
