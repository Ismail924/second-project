name: RIVAYA 4.4 automatic Apple signing to TestFlight
on:
  push:
    branches: ['feature/rivaya-widgetkit-4.4']
    paths:
      - '.github/workflows/rivaya-44-auto-sign.yml'
      - 'rivaya-next/ios/scripts/auto-sign-widget44.sh'
      - 'rivaya-next/ios/fastlane/Fastfile'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rivaya-44-auto-sign
  cancel-in-progress: false
jobs:
  sign-and-upload:
    runs-on: macos-15
    environment: app-store
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Verify real widget calculations and preserve existing app data
        run: |
          node rivaya-next/tests/widget-snapshot-check.cjs
          node rivaya-next/tests/state-check.cjs
          node rivaya-next/tests/next-state-check.cjs
      - name: Prepare Xcode and app assets
        run: |
          bash rivaya-next/ios/scripts/select-xcode.sh
          python3 rivaya-next/ios/scripts/prepare-resources.py
          brew install xcodegen
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: rivaya-next/ios
      - name: Compute unique TestFlight build number
        run: echo "RIVAYA_BUILD_NUMBER=$((44000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Try Xcode automatic App Groups and WidgetKit signing
        working-directory: rivaya-next/ios
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: bash scripts/auto-sign-widget44.sh
      - name: Upload signed WidgetKit IPA and confirm internal TestFlight group
        working-directory: rivaya-next/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          FASTLANE_SKIP_UPDATE_CHECK: 'true'
          FASTLANE_HIDE_CHANGELOG: 'true'
          FASTLANE_OPT_OUT_USAGE: 'true'
        run: bundle exec fastlane ios beta_widget_existing
