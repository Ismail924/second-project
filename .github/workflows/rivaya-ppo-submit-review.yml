name: RIVAYA submit new screenshots for Apple review without new binary
on:
  push:
    branches: ['feature/rivaya-widget-polish-441']
    paths: ['.github/workflows/rivaya-ppo-submit-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  submit-ppo:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: app-store
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: rivaya-next/ios
      - name: Confirm four images and submit only PPO review item
        working-directory: rivaya-next/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: bundle exec ruby scripts/ppo-submit-review.rb
