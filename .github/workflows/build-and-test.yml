name: Build and test RIVAYA 4

on:
  workflow_dispatch:
  push:
    paths:
      - 'rivaya-next/**'
      - '.github/workflows/build-and-test.yml'

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      PATH: /usr/local/lib/android/sdk/cmdline-tools/latest/bin:/usr/local/lib/android/sdk/platform-tools:/usr/local/lib/android/sdk/emulator:/home/runner/work/_temp/.gradle-actions/gradle-installations/installs/gradle-8.9/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build debug APK and test APK
        working-directory: rivaya-next
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Launch emulator and run smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: cd rivaya-next && gradle :app:connectedDebugAndroidTest --stacktrace

      - name: Prepare tested APK
        if: success()
        run: cp rivaya-next/app/build/outputs/apk/debug/app-debug.apk RIVAYA-4.0.1-RC2-TESTED.apk

      - name: Upload tested APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RIVAYA-4.0.1-RC2-TESTED
          path: RIVAYA-4.0.1-RC2-TESTED.apk
          if-no-files-found: error

      - name: Prepare Android signing tools
        if: success()
        run: |
          mkdir -p android-sign-tools/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" android-sign-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" android-sign-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" android-sign-tools/lib/

      - name: Upload Android signing tools
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-sign-tools-35
          path: android-sign-tools
          if-no-files-found: error
