name: Build and test RIVAYA 3.0

on:
  workflow_dispatch:
  push:
    paths:
      - 'rivaya-next/**'
      - '.github/workflows/build-and-test.yml'

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK pieces
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Build debug APK and test APK
        working-directory: rivaya-next
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Launch emulator and run smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: cd rivaya-next && gradle :app:connectedDebugAndroidTest --stacktrace

      - name: Prepare tested APK
        if: success()
        run: cp rivaya-next/app/build/outputs/apk/debug/app-debug.apk RIVAYA-3.0-CLEAN-TESTED.apk

      - name: Upload tested APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RIVAYA-3.0-CLEAN-TESTED
          path: RIVAYA-3.0-CLEAN-TESTED.apk
          if-no-files-found: error
