name: RIVAYA 4.4 widgets internal TestFlight
on:
  push:
    branches: ['feature/rivaya-widgetkit-4.4']
    paths:
      - 'rivaya-next/ios/**'
      - 'rivaya-next/app/src/main/assets/**'
      - '.github/workflows/rivaya-widgetkit-44-testflight.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rivaya-44-testflight
  cancel-in-progress: false
jobs:
  signed-widgets:
    runs-on: macos-15
    timeout-minutes: 55
    environment: app-store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check widget correctness and preserve existing app data
        run: |
          node rivaya-next/tests/widget-snapshot-check.cjs
          node rivaya-next/tests/state-check.cjs
          node rivaya-next/tests/next-state-check.cjs
          node rivaya-next/tests/sync-check.cjs
      - name: Require Apple's separate App Group distribution profiles
        env:
          APP_PROFILE: ${{ secrets.APPLE_APP_GROUP_PROFILE_BASE64 }}
          WIDGET_PROFILE: ${{ secrets.APPLE_WIDGET_PROFILE_BASE64 }}
        run: |
          if [ -z "$APP_PROFILE" ] || [ -z "$WIDGET_PROFILE" ]; then
            echo "::error::To install Widgets via TestFlight, register group.app.rivaya.smart01 in Apple Developer, attach it to app.rivaya.smart01 and app.rivaya.smart01.widgets, regenerate the App Store distribution profiles for BOTH targets, and add GitHub secrets APPLE_APP_GROUP_PROFILE_BASE64 and APPLE_WIDGET_PROFILE_BASE64 in app-store environment."
            exit 1
          fi
      - run: bash rivaya-next/ios/scripts/select-xcode.sh
      - run: python3 rivaya-next/ios/scripts/prepare-resources.py
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: rivaya-next/ios
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: rivaya-next/ios
      - name: Sign both targets and upload only to the internal TestFlight group
        working-directory: rivaya-next/ios
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_APP_GROUP_PROFILE_BASE64: ${{ secrets.APPLE_APP_GROUP_PROFILE_BASE64 }}
          APPLE_WIDGET_PROFILE_BASE64: ${{ secrets.APPLE_WIDGET_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          RIVAYA_WORKFLOW_NUMBER: ${{ github.run_number }}
          FASTLANE_SKIP_UPDATE_CHECK: 'true'
          FASTLANE_HIDE_CHANGELOG: 'true'
          FASTLANE_OPT_OUT_USAGE: 'true'
        run: |
          export RIVAYA_BUILD_NUMBER=$((44000 + RIVAYA_WORKFLOW_NUMBER))
          bundle exec fastlane ios beta_widgets
