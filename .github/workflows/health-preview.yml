name: RIVAYA Health disclosure check
on:
  push:
    branches: ['release/health-info-4.0.3']
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node rivaya-next/tests/state-check.cjs && node rivaya-next/tests/sync-check.cjs && node rivaya-next/tests/sync-transport-check.cjs
      - name: Install browser
        run: |
          npm install --prefix "$RUNNER_TEMP/rivaya-web" playwright@1.62.1
          node "$RUNNER_TEMP/rivaya-web/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check Health disclosure and responsive layout
        env:
          NODE_PATH: ${{ runner.temp }}/rivaya-web/node_modules
        run: node rivaya-next/tests/health-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RIVAYA-4.0.3-health-preview
          path: health-shots
