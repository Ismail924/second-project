name: RIVAYA 4.5 authentic screenshots preview
on:
  push:
    branches: ['feature/rivaya-4.5-optional-shared-goals-steps']
    paths: ['.github/workflows/rivaya-45-screens-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser preview runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/rivaya-web" playwright@1.62.1
          node "$RUNNER_TEMP/rivaya-web/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Capture authentic RIVAYA 4.5 interface with sample data
        env:
          NODE_PATH: ${{ runner.temp }}/rivaya-web/node_modules
        run: node rivaya-next/tests/capture-store-442.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RIVAYA-4.5-real-UI-screens-preview-not-uploaded
          path: appstore-shots-442
