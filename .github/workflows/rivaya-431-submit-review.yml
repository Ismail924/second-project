name: RIVAYA 4.3.1 verify TestFlight access and submit Apple review
on:
  push:
    branches: ['release/rivaya-4.3.1']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  release-verified-build:
    runs-on: macos-15
    timeout-minutes: 35
    environment: app-store
    steps:
      - uses: actions/checkout@v4
      - name: Verify previous iOS, browser and Android tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ios="$(gh api repos/$GITHUB_REPOSITORY/actions/runs/41064728274/jobs)"
          web="$(gh api repos/$GITHUB_REPOSITORY/actions/runs/41064990426)"
          android="$(gh api repos/$GITHUB_REPOSITORY/actions/runs/41064728196)"
          echo "$ios" | jq -e '[.jobs[].steps[] | select(.name == "Test cloud-enabled iOS guest mode and persistence before signing" and .conclusion == "success")] | length > 0'
          echo "$web" | jq -e '.conclusion == "success" and .head_sha == "671d8f17f1f7b6ee158338ef05ab74350cd20277"'
          echo "$android" | jq -e '.conclusion == "success" and .head_sha == "d2377dda067b0b135b239d443185f138e5fa5812"'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: rivaya-next/ios
      - name: Verify exact 4.3.1 build in Apple, grant existing internal TestFlight group access
        working-directory: rivaya-next/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: bundle exec ruby scripts/finalize-existing-testflight-431.rb
      - name: Set required What's New for version 4.3.1 on App Store Connect
        working-directory: rivaya-next/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: bundle exec ruby scripts/set-appstore-whatsnew-431.rb
      - name: Submit already-verified exact build for App Store review
        working-directory: rivaya-next/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          RIVAYA_STORE_BUILD_NUMBER: '41017'
          FASTLANE_SKIP_UPDATE_CHECK: 'true'
          FASTLANE_HIDE_CHANGELOG: 'true'
          FASTLANE_OPT_OUT_USAGE: 'true'
        run: bundle exec fastlane ios submit_existing_431
