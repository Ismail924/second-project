name: RIVAYA optimize live promo text and next-version ASO
on:
  push:
    branches: ['feature/rivaya-widget-polish-441']
    paths: ['.github/workflows/rivaya-aso-update.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    environment: app-store
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: rivaya-next/ios
      - name: Update published promotional text and draft 4.4.2 ASO without release
        working-directory: rivaya-next/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: bundle exec ruby scripts/aso-update.rb
