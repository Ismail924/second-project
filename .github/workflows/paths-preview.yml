name: RIVAYA paths preview
on:
  push:
    branches: ['feature/personal-paths']
  pull_request:
    paths: ['rivaya-next/**', '.github/workflows/paths-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Data and migration checks
        run: |
          node rivaya-next/tests/state-check.cjs
          node rivaya-next/tests/paths-check.cjs
          node rivaya-next/tests/sync-check.cjs
          node rivaya-next/tests/sync-transport-check.cjs
      - name: Install browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/rivaya-web" playwright@1.62.1
          node "$RUNNER_TEMP/rivaya-web/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Exercise mobile interface
        env:
          NODE_PATH: ${{ runner.temp }}/rivaya-web/node_modules
          RIVAYA_SHOTS: paths-shots
        run: node rivaya-next/tests/paths-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RIVAYA-paths-preview
          path: paths-shots
