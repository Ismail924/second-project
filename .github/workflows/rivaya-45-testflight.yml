name: RIVAYA 4.5 — verified internal TestFlight
on:
  push:
    branches: ['feature/rivaya-4.5-optional-shared-goals-steps']
    paths:
      - 'rivaya-next/ios/project.yml'
      - 'rivaya-next/app/src/main/assets/account-ui.js'
      - 'rivaya-next/app/src/main/assets/shared-service.js'
      - '.github/workflows/rivaya-45-testflight.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: rivaya-45-internal-testflight
  cancel-in-progress: false
jobs:
  preflight-and-testflight:
    runs-on: macos-15
    timeout-minutes: 90
    environment: app-store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript and existing data safety checks
        run: |
          set -euo pipefail
          node --check rivaya-next/app/src/main/assets/rivaya-v5.js
          node --check rivaya-next/app/src/main/assets/account-ui.js
          grep -q 'enabled:true,appleEnabled:false' rivaya-next/app/src/main/assets/backend-config.js
          node rivaya-next/tests/state-check.cjs
          node rivaya-next/tests/next-state-check.cjs
          node rivaya-next/tests/sync-check.cjs
          node rivaya-next/tests/widget-snapshot-check.cjs
      - name: Prepare Xcode project and dependencies
        run: |
          bash rivaya-next/ios/scripts/select-xcode.sh
          python3 rivaya-next/ios/scripts/prepare-resources.py
          brew install xcodegen
          cd rivaya-next/ios
          xcodegen generate
      - name: Compile unsigned simulator app before signing
        working-directory: rivaya-next/ios
        run: |
          xcodebuild -project Rivaya.xcodeproj -scheme Rivaya -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: rivaya-next/ios
      - name: Unique internal build number
        run: echo "RIVAYA_BUILD_NUMBER=$((46000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Prepare App Group provisioning profiles
        working-directory: rivaya-next/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: bundle exec ruby scripts/widget44-auto-profiles.rb
      - name: Sign and upload to INTERNAL TestFlight only
        working-directory: rivaya-next/ios
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_APP_GROUP_PROFILE_BASE64: ${{ env.APPLE_APP_GROUP_PROFILE_BASE64 }}
          APPLE_WIDGET_PROFILE_BASE64: ${{ env.APPLE_WIDGET_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          FASTLANE_SKIP_UPDATE_CHECK: 'true'
          FASTLANE_HIDE_CHANGELOG: 'true'
          FASTLANE_OPT_OUT_USAGE: 'true'
        run: bundle exec fastlane ios beta_widgets
      - name: Confirm processing and internal testers
        working-directory: rivaya-next/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: bundle exec ruby scripts/finalize-widget-testflight.rb
