name: Build RIVAYA NEW

on:
  workflow_dispatch:
  push:
    paths:
      - 'rivaya-next/**'
      - '.github/workflows/build-rivaya.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rivaya-next

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RIVAYA-NEW-3.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RIVAYA-NEW-3.0
          path: rivaya-next/RIVAYA-NEW-3.0.apk
          if-no-files-found: error
