name: Rivaya
options:
  bundleIdPrefix: app.rivaya
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: M2329MH9ZX
    MARKETING_VERSION: '4.0.2'
    CURRENT_PROJECT_VERSION: '40002'
targets:
  Rivaya:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        excludes: ["**/*.base64"]
      - path: ../app/src/main/assets
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.rivaya.smart01
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: RIVAYA
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations: [ru]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHealthShareUsageDescription: RIVAYA читает количество шагов, чтобы показывать вашу ежедневную активность и прогресс.
    entitlements:
      path: Rivaya.entitlements
      properties:
        com.apple.developer.healthkit: true
schemes:
  Rivaya:
    build:
      targets:
        Rivaya: all
