<style>
:root{--bg:#050710;--bg2:#080b18;--card:#0e1424;--card2:#111a2d;--line:#202d49;--text:#f7f8ff;--muted:#8d96aa;--violet:#7b61ff;--violet2:#a657ff;--cyan:#42dcff;--mint:#53e7b7;--danger:#ff647c;--shadow:0 18px 50px #0008}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100%;overscroll-behavior:none}body{background:radial-gradient(circle at 84% -8%,#17235b 0,transparent 30%),radial-gradient(circle at -15% 15%,#25155a 0,transparent 26%),var(--bg)}button,input,select{font:inherit}.app{max-width:720px;margin:auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 10px) 18px calc(112px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;padding:8px 0 18px}.brand{display:flex;align-items:center;gap:11px;font-weight:850;letter-spacing:.2em;font-size:14px}.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#121a3b,#060815);border:1px solid #3545a7;box-shadow:0 0 26px #6c51ff55,inset 0 0 22px #38d9ff13}.logo svg{width:31px;height:31px}.mini-avatar{width:44px;height:44px;border-radius:50%;border:1px solid #283553;background:#111726;color:#fff;display:grid;place-items:center;overflow:hidden;font-weight:800}.mini-avatar img,.avatar img{width:100%;height:100%;object-fit:cover}.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin:4px 0 20px}.page-head h1{font-size:34px;margin:0;letter-spacing:-.04em}.page-head p{margin:5px 0 0;color:var(--muted);font-size:14px}.pill{border:1px solid #30406a;background:#0b1120;border-radius:999px;padding:8px 12px;color:#b8c2da;font-size:12px}.hero{border:1px solid #263554;background:linear-gradient(145deg,#11182c,#0b1020);border-radius:28px;padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:before{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:#7d5cff22;filter:blur(10px);right:-70px;top:-75px}.progress-row{display:flex;gap:16px;align-items:center}.ring{--p:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--cyan) calc(var(--p)*1%),#1a2540 0);padding:8px;box-shadow:0 0 26px #42dcff22}.ring>div{height:100%;border-radius:50%;background:#0a1020;display:grid;place-items:center;text-align:center}.ring b{font-size:24px}.ring span{display:block;font-size:10px;color:var(--muted);margin-top:-12px}.hero h2{font-size:22px;margin:0 0 5px}.hero p{margin:0;color:#99a3b8;line-height:1.45}.section{margin-top:18px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px}.section-head h2{font-size:17px;margin:0}.link{background:none;border:0;color:#9eaaff;font-weight:700;padding:8px}.card{border:1px solid #202c48;background:#0c1220;border-radius:22px;padding:15px}.focus{display:flex;align-items:center;gap:13px}.focus-icon{width:44px;height:44px;border-radius:15px;background:linear-gradient(145deg,#242065,#111c47);display:grid;place-items:center;color:#c8b7ff;font-size:20px}.focus b{display:block;font-size:16px}.focus span{color:var(--muted);font-size:13px}.habit{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #19243c}.habit:last-child{border-bottom:0}.check{width:28px;height:28px;border-radius:9px;border:2px solid #3a4b74;background:#0a0f1c;color:#07101a;display:grid;place-items:center;font-weight:900}.check.done{background:linear-gradient(135deg,var(--mint),var(--cyan));border-color:transparent}.habit-main{flex:1}.habit-main b{display:block;font-size:15px}.habit-main small{color:var(--muted)}.tag{padding:5px 8px;border-radius:999px;background:#171d34;color:#aeb9d2;font-size:10px}.goal-card{background:linear-gradient(145deg,#10172a,#0a1020);border:1px solid #263351;border-radius:22px;padding:16px}.goal-top{display:flex;justify-content:space-between;gap:12px}.goal-top b{font-size:16px}.goal-top span{color:#a993ff;font-weight:850}.bar{height:7px;border-radius:99px;background:#19233a;overflow:hidden;margin-top:13px}.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--violet),var(--cyan))}.steps{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px}.steps b{font-size:27px}.steps span{display:block;color:var(--muted);font-size:12px}.steps-ring{width:58px;height:58px;border-radius:50%;border:7px solid #27324d;border-top-color:var(--cyan);border-right-color:var(--violet);display:grid;place-items:center;font-size:11px}.empty{padding:26px 12px;text-align:center;color:#8791a6}.fab{position:fixed;right:max(22px,calc((100vw - 720px)/2 + 22px));bottom:calc(94px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:20px;border:1px solid #896eff;background:linear-gradient(145deg,#8b5cff,#5f50ff);color:#fff;font-size:28px;box-shadow:0 12px 36px #6046ff66;z-index:8}.nav{position:fixed;z-index:10;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(94vw,680px);height:76px;border-radius:25px;background:#0b0f19e8;border:1px solid #26324b;backdrop-filter:blur(24px);display:grid;grid-template-columns:repeat(4,1fr);padding:7px;box-shadow:0 20px 60px #000b}.nav button{border:0;background:none;color:#727d93;border-radius:19px;font-size:11px;font-weight:700}.nav button .ico{display:block;font-size:23px;margin-bottom:3px}.nav button.active{background:#17152c;color:#9f8cff;box-shadow:inset 0 0 0 1px #3b315c}.tabs{display:flex;background:#0a0f1b;border:1px solid #1e2942;border-radius:16px;padding:4px;margin-bottom:14px}.tabs button{flex:1;border:0;background:none;color:#7e899e;padding:10px;border-radius:12px;font-weight:750}.tabs button.active{background:#232944;color:#fff}.plan-item{padding:15px;border:1px solid #202b45;background:#0c1220;border-radius:19px;margin-bottom:10px}.plan-item h3{margin:0 0 5px;font-size:16px}.plan-item p{margin:0;color:var(--muted);font-size:12px}.plan-meta{display:flex;justify-content:space-between;align-items:center;margin-top:13px}.small-progress{height:6px;background:#192238;border-radius:99px;flex:1;margin-right:14px;overflow:hidden}.small-progress i{display:block;height:100%;background:linear-gradient(90deg,#745dff,#44dfff)}.chart{height:165px;display:flex;align-items:end;gap:9px;padding:18px 8px 4px}.col{flex:1;text-align:center}.col i{display:block;min-height:4px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,#5de0ff,#765aff);box-shadow:0 0 14px #5e7cff33}.col small{display:block;color:#748098;font-size:9px;margin-top:6px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{aspect-ratio:1;border-radius:10px;background:#111827;border:1px solid #202b43;display:grid;place-items:center;color:#738097;font-size:11px}.day.hit{background:#172e36;border-color:#286b67;color:#66e6cb}.day.partial{background:#282342;border-color:#51458a;color:#c5b7ff}.profile-hero{display:flex;align-items:center;gap:16px;padding:18px;border:1px solid #263554;background:linear-gradient(145deg,#10182b,#0b1020);border-radius:26px}.avatar{width:86px;height:86px;border-radius:28px;border:2px solid #6f68ff;background:linear-gradient(135deg,#1d2151,#0b132a);display:grid;place-items:center;overflow:hidden;font-size:34px;font-weight:800;position:relative}.avatar:after{content:"+";position:absolute;right:2px;bottom:2px;width:24px;height:24px;border-radius:8px;background:#785dff;display:grid;place-items:center;font-size:15px;border:2px solid #0c1220}.profile-copy h2{margin:0 0 5px}.profile-copy p{margin:0 0 9px;color:var(--muted);font-size:12px}.profile-copy button{border:0;background:none;color:#9b8cff;font-weight:800;padding:3px 0}.stat-strip{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;border:1px solid #202c48;background:#0c1220;border-radius:22px}.stat-strip div{padding:15px 8px;text-align:center;border-right:1px solid #1b2740}.stat-strip div:last-child{border:0}.stat-strip b{font-size:20px;display:block}.stat-strip span{font-size:10px;color:var(--muted)}.setting{display:flex;align-items:center;gap:12px;padding:15px;border:1px solid #202b46;background:#0c1220;border-radius:18px;margin-bottom:9px}.setting-icon{width:38px;height:38px;border-radius:13px;background:#161e3a;color:#8da0ff;display:grid;place-items:center}.setting-main{flex:1}.setting-main b{display:block;font-size:14px}.setting-main span{font-size:11px;color:var(--muted)}.setting-action{color:#9a8cff;font-size:12px}.modal{position:fixed;z-index:30;inset:0;background:#01040bdc;display:none;align-items:flex-end;justify-content:center;padding:14px}.modal.show{display:flex}.sheet{width:min(100%,680px);max-height:88vh;overflow:auto;border:1px solid #2a3859;background:#0c1220;border-radius:28px;padding:20px;box-shadow:0 -20px 70px #000c}.sheet h2{margin:0 0 16px}.field{margin-bottom:13px}.field label{display:block;color:#a8b1c4;font-size:12px;margin:0 0 6px}.field input,.field select{width:100%;background:#080d18;border:1px solid #263451;color:#fff;border-radius:14px;padding:13px;outline:none}.primary{width:100%;border:0;border-radius:15px;padding:14px;font-weight:850;color:#fff;background:linear-gradient(135deg,#805eff,#5c5cff)}.secondary{width:100%;border:1px solid #2a3755;border-radius:15px;padding:13px;font-weight:750;color:#c5cbea;background:#101725;margin-top:9px}.danger{color:#ff7a8e}.row{display:flex;gap:9px}.row>*{flex:1}.toast{position:fixed;z-index:50;left:50%;bottom:calc(105px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:#eef2ff;color:#11172a;padding:10px 14px;border-radius:13px;font-weight:700;font-size:12px;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="brand"><div class="logo" aria-hidden="true"><svg viewBox="0 0 100 100"><defs><linearGradient id="g"><stop stop-color="#4ce7ff"/><stop offset="1" stop-color="#a258ff"/></linearGradient></defs><path d="M20 78V22h35c20 0 31 9 31 25 0 12-6 20-17 24l18 21H66L52 75H40v17H20zm20-38v20h17c7 0 11-4 11-10 0-7-4-10-11-10z" fill="url(#g)"/></svg></div><span>RIVAYA</span></div><button class="mini-avatar" id="topAvatar" onclick="go('profile')">Р</button></header>
  <main id="view"></main>
</div>
<button class="fab" id="fab" onclick="quickAdd()">＋</button>
<nav class="nav" id="nav">
  <button data-page="today" onclick="go('today')"><span class="ico">⌂</span>Сегодня</button>
  <button data-page="plan" onclick="go('plan')"><span class="ico">▦</span>План</button>
  <button data-page="progress" onclick="go('progress')"><span class="ico">▥</span>Прогресс</button>
  <button data-page="profile" onclick="go('profile')"><span class="ico">♙</span>Профиль</button>
</nav>
<input id="avatarInput" type="file" accept="image/*" hidden>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
const KEY='rivaya3_state_v1';
const iso=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)};
const today=()=>iso(new Date());
const defaults={profile:{name:'Пользователь',avatar:''},habits:[],goals:[],checks:{},steps:0,stepGoal:8000,stepAccess:'denied',reminders:{enabled:false,time:'20:30'},createdAt:Date.now()};
let state=load(),page='today',planTab='habits',progressPeriod='week';
function load(){try{return {...structuredClone(defaults),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return structuredClone(defaults)}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1800)}
function pct(a,b){return b?Math.max(0,Math.min(100,Math.round(a/b*100))):0}
function doneToday(id){return !!state.checks[today()+':'+id]}
function todayDone(){return state.habits.filter(h=>doneToday(h.id)).length}
function goalPct(g){return pct(g.value||0,g.target||100)}
function initials(){return (state.profile.name||'Р').trim().slice(0,1).toUpperCase()||'Р'}
function avatarHtml(cls=''){return state.profile.avatar?`<img class="${cls}" src="${state.profile.avatar}" alt="">`:esc(initials())}
function refreshTop(){document.getElementById('topAvatar').innerHTML=avatarHtml();}
function go(p){page=p;render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){refreshTop();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('fab').style.display=(page==='plan'||page==='today')?'block':'none';document.getElementById('view').innerHTML=({today:renderToday,plan:renderPlan,progress:renderProgress,profile:renderProfile}[page]||renderToday)()}
function dateLabel(){return new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long'}).format(new Date())}
function renderToday(){const d=todayDone(),n=state.habits.length,p=pct(d,n),nextGoal=state.goals[0];return `<div class="page-head"><div><h1>Сегодня</h1><p>${esc(dateLabel())}</p></div><span class="pill">RIVAYA 3.0</span></div>
<section class="hero"><div class="progress-row"><div class="ring" style="--p:${p}"><div><b>${p}%</b><span>${d}/${n}</span></div></div><div><h2>${n?(d===n?'На сегодня всё закрыто ✓':'Твой день в движении'):'Начни с одного шага'}</h2><p>${n?`${d} из ${n} привычек выполнено сегодня.`:'Добавь первую привычку или цель — RIVAYA соберёт твой день.'}</p></div></div></section>
<div class="section"><div class="section-head"><h2>Фокус дня</h2></div><div class="card focus"><div class="focus-icon">✦</div><div><b>${n&&d<n?'Закрой следующую привычку':state.steps<state.stepGoal?'Продвинься по шагам':'Определи следующий шаг'}</b><span>${n&&d<n?'Один тап — и прогресс уже растёт.':state.steps<state.stepGoal?`${state.steps.toLocaleString('ru-RU')} из ${state.stepGoal.toLocaleString('ru-RU')} шагов`:'Добавь цель в разделе «План».'}</span></div></div></div>
<div class="section"><div class="section-head"><h2>Привычки на сегодня</h2><button class="link" onclick="go('plan')">Все ›</button></div><div class="card">${state.habits.length?state.habits.slice(0,5).map(h=>habitRow(h)).join(''):`<div class="empty">Пока нет привычек.<br>Нажми «＋» и создай первую.</div>`}</div></div>
<div class="section"><div class="section-head"><h2>Ближайшая цель</h2><button class="link" onclick="go('plan')">План ›</button></div>${nextGoal?goalCard(nextGoal):`<div class="card empty">Добавь цель, чтобы видеть её рядом с ежедневными действиями.</div>`}</div>
<div class="section"><div class="section-head"><h2>Шаги сегодня</h2><button class="link" onclick="requestSteps()">${state.stepAccess==='granted'?'Обновить':'Подключить'}</button></div><div class="card steps"><div><b>${Number(state.steps||0).toLocaleString('ru-RU')}</b><span>из ${Number(state.stepGoal).toLocaleString('ru-RU')} шагов · ${pct(state.steps,state.stepGoal)}%</span><div class="bar"><i style="width:${pct(state.steps,state.stepGoal)}%"></i></div></div><div class="steps-ring">${pct(state.steps,state.stepGoal)}%</div></div></div>`}
function habitRow(h){const done=doneToday(h.id);return `<div class="habit"><button class="check ${done?'done':''}" onclick="toggleHabit('${h.id}')">${done?'✓':''}</button><div class="habit-main"><b>${esc(h.name)}</b><small>${h.goalId?'Связана с целью':'Ежедневная привычка'}</small></div><span class="tag">${done?'Готово':'Сегодня'}</span></div>`}
function toggleHabit(id){const k=today()+':'+id;state.checks[k]=!state.checks[k];save();render();}
function goalCard(g){const p=goalPct(g);return `<div class="goal-card"><div class="goal-top"><div><b>${esc(g.name)}</b><p style="color:var(--muted);font-size:12px;margin:5px 0 0">${g.target?`${g.value||0} из ${g.target}`:'Цель в работе'}</p></div><span>${p}%</span></div><div class="bar"><i style="width:${p}%"></i></div></div>`}
function renderPlan(){const items=planTab==='habits'?state.habits:state.goals;return `<div class="page-head"><div><h1>План</h1><p>Цели и привычки работают вместе</p></div></div><div class="tabs"><button class="${planTab==='habits'?'active':''}" onclick="planTab='habits';render()">Привычки</button><button class="${planTab==='goals'?'active':''}" onclick="planTab='goals';render()">Цели</button></div>${items.length?items.map(x=>planTab==='habits'?habitPlan(x):goalPlan(x)).join(''):`<div class="card empty">Здесь пока пусто.<br>Нажми «＋», чтобы начать.</div>`}`}
function habitPlan(h){const goal=state.goals.find(g=>g.id===h.goalId);return `<div class="plan-item"><h3>${esc(h.name)}</h3><p>${goal?'Двигает цель: '+esc(goal.name):'Самостоятельная привычка'}</p><div class="plan-meta"><span class="pill">${doneToday(h.id)?'Сегодня ✓':'На сегодня'}</span><button class="link danger" onclick="removeHabit('${h.id}')">Удалить</button></div></div>`}
function goalPlan(g){const p=goalPct(g);return `<div class="plan-item"><h3>${esc(g.name)}</h3><p>${state.habits.filter(h=>h.goalId===g.id).length} связанных привычек</p><div class="plan-meta"><div class="small-progress"><i style="width:${p}%"></i></div><b>${p}%</b><button class="link danger" onclick="removeGoal('${g.id}')">×</button></div></div>`}
function removeHabit(id){if(confirm('Удалить привычку?')){state.habits=state.habits.filter(h=>h.id!==id);save();render()}}
function removeGoal(id){if(confirm('Удалить цель?')){state.goals=state.goals.filter(g=>g.id!==id);state.habits=state.habits.map(h=>h.goalId===id?{...h,goalId:''}:h);save();render()}}
function quickAdd(){if(page==='plan'&&planTab==='goals')openGoal();else openHabit()}
function openHabit(){openModal(`<h2>Новая привычка</h2><div class="field"><label>Название</label><input id="fHabit" placeholder="Например: Читать 20 минут"></div><div class="field"><label>Связать с целью</label><select id="fHabitGoal"><option value="">Без цели</option>${state.goals.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select></div><button class="primary" onclick="saveHabit()">Создать привычку</button><button class="secondary" onclick="closeModal()">Отмена</button>`)}
function saveHabit(){const n=document.getElementById('fHabit').value.trim();if(!n)return toast('Введите название');state.habits.push({id:'h'+Date.now(),name:n,goalId:document.getElementById('fHabitGoal').value,created:today()});save();closeModal();planTab='habits';page='plan';render();toast('Привычка создана ✓')}
function openGoal(){openModal(`<h2>Новая цель</h2><div class="field"><label>Название</label><input id="fGoal" placeholder="Например: Выучить английский"></div><div class="row"><div class="field"><label>Текущий результат</label><input id="fGoalValue" type="number" value="0"></div><div class="field"><label>Цель</label><input id="fGoalTarget" type="number" value="100"></div></div><button class="primary" onclick="saveGoal()">Создать цель</button><button class="secondary" onclick="closeModal()">Отмена</button>`)}
function saveGoal(){const n=document.getElementById('fGoal').value.trim();if(!n)return toast('Введите название');state.goals.push({id:'g'+Date.now(),name:n,value:Number(document.getElementById('fGoalValue').value)||0,target:Math.max(1,Number(document.getElementById('fGoalTarget').value)||100)});save();closeModal();planTab='goals';page='plan';render();toast('Цель создана ✓')}
function renderProgress(){const days=progressPeriod==='week'?7:30, arr=[];let total=0,possible=0;for(let i=days-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=iso(d);const done=state.habits.filter(h=>state.checks[k+':'+h.id]).length;arr.push({d,k,done});total+=done;possible+=state.habits.length}const overall=pct(total,possible),max=Math.max(1,...arr.map(x=>x.done));const cal=[];for(let i=27;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=iso(d);const dn=state.habits.filter(h=>state.checks[k+':'+h.id]).length;cal.push(`<div class="day ${dn===state.habits.length&&dn?'hit':dn?'partial':''}">${d.getDate()}</div>`)}return `<div class="page-head"><div><h1>Прогресс</h1><p>Только твои реальные отметки</p></div><span class="pill">${overall}%</span></div><div class="tabs"><button class="${progressPeriod==='week'?'active':''}" onclick="progressPeriod='week';render()">Неделя</button><button class="${progressPeriod==='month'?'active':''}" onclick="progressPeriod='month';render()">Месяц</button></div><section class="hero"><div class="progress-row"><div class="ring" style="--p:${overall}"><div><b>${overall}%</b><span>итог</span></div></div><div><h2>${possible?'Реальный прогресс':'Пока мало данных'}</h2><p>${possible?`${total} выполнений из ${possible} возможных.`:'Отмечай привычки, и здесь появится честная статистика.'}</p></div></div></section><div class="section"><div class="section-head"><h2>Динамика</h2></div><div class="card chart">${arr.map((x,i)=>`<div class="col"><i style="height:${Math.max(4,Math.round(x.done/max*120))}px"></i><small>${progressPeriod==='week'?['Пн','Вт','Ср','Чт','Пт','Сб','Вс'][i]:new Date(x.k).getDate()}</small></div>`).join('')}</div></div><div class="section"><div class="section-head"><h2>Последние 28 дней</h2></div><div class="card calendar">${cal.join('')}</div></div>`}
function renderProfile(){return `<div class="page-head"><div><h1>Профиль</h1><p>Твоя RIVAYA — под тебя</p></div></div><section class="profile-hero"><button class="avatar" onclick="openAvatarPicker()">${avatarHtml()}</button><div class="profile-copy"><h2>${esc(state.profile.name)}</h2><p>Маленькие шаги создают большие перемены.</p><button onclick="openAvatarPicker()">${state.profile.avatar?'Изменить фото':'Добавить фото'}</button></div></section><section class="stat-strip"><div><b>${todayDone()}</b><span>сегодня</span></div><div><b>${state.habits.length}</b><span>привычек</span></div><div><b>${Number(state.steps||0).toLocaleString('ru-RU')}</b><span>шагов</span></div></section><div class="section"><div class="setting" onclick="editProfile()"><div class="setting-icon">✦</div><div class="setting-main"><b>Имя и профиль</b><span>${esc(state.profile.name)} · персональные настройки</span></div><div class="setting-action">Изменить ›</div></div><div class="setting" onclick="openAvatarPicker()"><div class="setting-icon">◉</div><div class="setting-main"><b>Фото профиля</b><span>${state.profile.avatar?'Фото сохранено':'Выберите фото из галереи'}</span></div><div class="setting-action">${state.profile.avatar?'Изменить':'Добавить'} ›</div></div><div class="setting" onclick="requestSteps()"><div class="setting-icon">♥</div><div class="setting-main"><b>Автоматические шаги</b><span>Датчик шагов телефона</span></div><div class="setting-action">${state.stepAccess==='granted'?'Подключено ✓':'Подключить ›'}</div></div><div class="setting" onclick="editReminders()"><div class="setting-icon">◌</div><div class="setting-main"><b>Напоминания</b><span>${state.reminders.enabled?'Каждый день · '+state.reminders.time:'Выключены'}</span></div><div class="setting-action">Настроить ›</div></div></div><div class="card" style="margin-top:18px;text-align:center;color:var(--muted);font-size:12px">RIVAYA 3.0 CLEAN · Автор @_isma_guder_</div>`}
function editProfile(){openModal(`<h2>Профиль</h2><div class="field"><label>Имя</label><input id="profileName" maxlength="30" value="${esc(state.profile.name)}"></div><div class="field"><label>Цель по шагам</label><input id="stepGoal" type="number" min="1000" step="500" value="${state.stepGoal}"></div><button class="primary" onclick="saveProfile()">Сохранить</button><button class="secondary" onclick="closeModal()">Отмена</button>`)}
function saveProfile(){state.profile.name=document.getElementById('profileName').value.trim()||'Пользователь';state.stepGoal=Math.max(1000,Number(document.getElementById('stepGoal').value)||8000);save();closeModal();render();toast('Профиль сохранён ✓')}
function editReminders(){openModal(`<h2>Напоминания</h2><div class="field"><label>Время</label><input id="remTime" type="time" value="${state.reminders.time||'20:30'}"></div><button class="primary" onclick="saveReminder(true)">Включить</button><button class="secondary" onclick="saveReminder(false)">Выключить</button><button class="secondary" onclick="testReminder()">Тест уведомления</button>`)}
function saveReminder(en){state.reminders.enabled=en;state.reminders.time=document.getElementById('remTime').value||'20:30';save();if(window.VektorNative?.configureReminders){const [h,m]=state.reminders.time.split(':').map(Number);try{window.VektorNative.requestNotificationPermission?.();window.VektorNative.configureReminders(en,h,m,-1,-1,-1,-1)}catch{}}closeModal();render();toast(en?'Напоминание включено':'Напоминания выключены')}
function testReminder(){try{window.VektorNative?.requestNotificationPermission?.();window.VektorNative?.testNotification?.();toast('Тест отправлен')}catch{toast('Тест доступен в Android-версии')}}
function openModal(html){document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function openAvatarPicker(){document.getElementById('avatarInput').click()}
document.getElementById('avatarInput').addEventListener('change',async e=>{const f=e.target.files?.[0];e.target.value='';if(!f)return;if(!f.type.startsWith('image/'))return toast('Выберите изображение');try{const url=URL.createObjectURL(f),img=new Image();await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src=url});const w=img.naturalWidth,h=img.naturalHeight,s=Math.min(w,h),sx=(w-s)/2,sy=(h-s)/2,c=document.createElement('canvas');c.width=c.height=320;c.getContext('2d').drawImage(img,sx,sy,s,s,0,0,320,320);URL.revokeObjectURL(url);state.profile.avatar=c.toDataURL('image/jpeg',.8);save();render();toast('Фото профиля обновлено ✓')}catch{toast('Не удалось обработать фото')}});
function requestSteps(){try{if(window.VektorNative?.requestStepAccess){window.VektorNative.requestStepAccess();setTimeout(()=>window.VektorNative.refreshSteps?.(),700);toast('Подтвердите доступ к шагам');return}}catch{}toast('Доступ к шагам доступен в Android-приложении')}
window.vektorOnNativeSteps=function(payload){try{const d=typeof payload==='string'?JSON.parse(payload):payload;state.stepAccess=d.status||'denied';state.steps=d.status==='granted'?Number(d.steps||0):0;save();render()}catch{}}
setTimeout(()=>{try{window.VektorNative?.refreshSteps?.()}catch{}},700);
refreshTop();render();
</script>
</body></html>
